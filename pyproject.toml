[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "decisionmesh"
version = "0.1.0"
description = "Cost-aware decision infrastructure for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"